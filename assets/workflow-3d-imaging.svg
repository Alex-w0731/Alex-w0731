<title id="title">AX / VOLUME — Alex Wang's reproducible 3D microscopy workflow</title>
<desc id="desc">Seven stages: calibrate, organize OME-Zarr, reconstruct, segment, review, quantify, export. Quality control loops connect segmentation and human review; native labels remain separate from display meshes.</desc>
