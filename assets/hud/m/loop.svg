  <line x1="66" y1="201" x2="66" y2="209" stroke="#60a5fa" stroke-width="1.8" class="flow" stroke-linecap="round"/><path d="M61 203l5 6l5 -6" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="66" y1="279" x2="66" y2="287" stroke="#ff5cb8" stroke-width="1.8" class="flow" stroke-linecap="round"/><path d="M61 281l5 6l5 -6" fill="none" stroke="#ff5cb8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 357V366a8 8 0 0 1 -8 8H30a8 8 0 0 1 -8 -8V96a8 8 0 0 1 8 -8H30" fill="none" stroke="#24365a" stroke-width="1"/><path d="M66 357V366a8 8 0 0 1 -8 8H30a8 8 0 0 1 -8 -8V96a8 8 0 0 1 8 -8H30" fill="none" stroke="#a78bfa" stroke-width="1.4" class="flow-slow" stroke-linecap="round" opacity=".9"/><path d="M24 83l6 5l-6 5" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="378" font-size="11" class="mono vi caps">NEW QUESTIONS</text>
  <circle cx="66" cy="88" r="46.8" fill="url(#halo)" class="breathe" style="animation-delay:0s"/><circle cx="66" cy="88" r="26" fill="#0b1222" stroke="#2ce8ff" stroke-width="1.5"/><g fill="none" stroke="#2ce8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="66" cy="88" r="11"/><path d="M66 71v6M66 99v6M49 88h6M77 88h6"/></g><circle cx="66" cy="88" r="2.6" fill="#2ce8ff"/>
  <text x="112" y="85" font-size="17" class="mono b caps" fill="#2ce8ff">OBSERVE</text><text x="112" y="107" font-size="15" class="sans mid">tumor &amp; clinical data</text><text x="414" y="85" font-size="12" class="mono low" text-anchor="end">01</text>
  <circle cx="66" cy="166" r="46.8" fill="url(#halo)" class="breathe" style="animation-delay:0.8s"/><circle cx="66" cy="166" r="26" fill="#0b1222" stroke="#60a5fa" stroke-width="1.5"/><path d="M54 173L65 169M62 156L65 169M75 162L65 169M77 176L65 169M62 156L75 162" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7"/><circle cx="54" cy="173" r="2.8" fill="#60a5fa"/><circle cx="62" cy="156" r="2.8" fill="#60a5fa"/><circle cx="75" cy="162" r="2.8" fill="#60a5fa"/><circle cx="77" cy="176" r="2.8" fill="#60a5fa"/><circle cx="65" cy="169" r="2.8" fill="#60a5fa"/>
  <text x="112" y="163" font-size="17" class="mono b caps" fill="#60a5fa">MODEL</text><text x="112" y="185" font-size="15" class="sans mid">single-cell &amp; spatial patterns</text><text x="414" y="163" font-size="12" class="mono low" text-anchor="end">02</text>
  <circle cx="66" cy="244" r="46.8" fill="url(#haloM)" class="breathe" style="animation-delay:1.6s"/><circle cx="66" cy="244" r="26" fill="#0b1222" stroke="#ff5cb8" stroke-width="1.5"/><g fill="none" stroke="#ff5cb8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M50 239H62M70 239H82"/><path d="M50 249H62M70 249H82"/><path d="M55 239v10M77 239v10" stroke-opacity=".55"/></g><path d="M68 229l-5 12h6l-5 12" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="241" font-size="17" class="mono b caps" fill="#ff5cb8">PERTURB</text><text x="112" y="263" font-size="15" class="sans mid">functional genomics</text><text x="414" y="241" font-size="12" class="mono low" text-anchor="end">03</text>
  <circle cx="66" cy="322" r="46.8" fill="url(#halo)" class="breathe" style="animation-delay:2.4s"/><circle cx="66" cy="322" r="26" fill="#0b1222" stroke="#34d399" stroke-width="1.5"/><g fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M66 307l13 7.5v15l-13 7.5l-13-7.5v-15z"/><path d="M60 322l4.5 4.5l8-9" stroke-width="2"/></g>
  <text x="112" y="319" font-size="17" class="mono b caps" fill="#34d399">VALIDATE</text><text x="112" y="341" font-size="15" class="sans mid">mechanisms &amp; targets</text><text x="414" y="319" font-size="12" class="mono low" text-anchor="end">04</text>
</svg>
