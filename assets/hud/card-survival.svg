<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 184" width="432" height="184" role="img" aria-label="03 / Clinical signals: expression and outcome">
  <title>03 / Clinical signals: expression and outcome</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ce8ff"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff5cb8"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ce8ff" stop-opacity=".9"/><stop offset="1" stop-color="#2ce8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ce8ff" stop-opacity=".35"/><stop offset="1" stop-color="#2ce8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloM" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5cb8" stop-opacity=".32"/><stop offset="1" stop-color="#ff5cb8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#18233a" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#24365a" opacity=".7"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .hi { fill: #eaf2ff; } .mid { fill: #a3b3cc; } .low { fill: #7889a6; }
    .cy { fill: #2ce8ff; } .cy2 { fill: #9ff4ff; } .mg { fill: #ff5cb8; }
    .vi { fill: #a78bfa; } .am { fill: #fbbf24; } .gr { fill: #34d399; } .bl { fill: #60a5fa; }
    .caps { letter-spacing: 0.16em; }
    .tight { letter-spacing: 0.04em; }
    .b { font-weight: 700; } .sb { font-weight: 600; }
    .s-cy { stroke: #2ce8ff; } .s-mg { stroke: #ff5cb8; } .s-vi { stroke: #a78bfa; }
    .s-line { stroke: #18233a; } .s-line2 { stroke: #24365a; } .s-low { stroke: #7889a6; }
    .nf { fill: none; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -64; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinr { to { transform: rotate(-360deg); } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .breathe { animation: breathe 4.8s ease-in-out infinite; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    .flow { stroke-dasharray: 6 10; animation: dash 2.4s linear infinite; }
    .flow-slow { stroke-dasharray: 2 14; animation: dash 5s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    .spinr { transform-box: fill-box; transform-origin: center; animation: spinr 36s linear infinite; }
    .floaty { animation: floaty 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="431" height="183" rx="12" fill="url(#bg)" stroke="#24365a"/>
  <rect x="1" y="1" width="430" height="182" rx="12" fill="url(#grid)"/>
  <g fill="none" stroke="#2ce8ff" stroke-width="1.4" stroke-linecap="round" opacity=".75"><path d="M9 25V14a5 5 0 0 1 5-5H25" /><path d="M407 9H418a5 5 0 0 1 5 5V25" /><path d="M423 159V170a5 5 0 0 1-5 5H407" /><path d="M25 175H14a5 5 0 0 1-5-5V159" /></g>
  <text x="26" y="36" font-size="14" class="mono b" fill="#2ce8ff" letter-spacing="1.2">03</text><text x="52" y="36" font-size="14" class="mono low">/</text><text x="68" y="36" font-size="12.5" class="mono mid caps">CLINICAL SIGNALS</text>
  <rect x="380.6" y="22" width="25.4" height="20" rx="10" fill="none" stroke="#24365a"/><text x="393.3" y="36" font-size="10.5" class="mono low caps" text-anchor="middle">R</text>
  <path d="M58 52V124H330" fill="none" stroke="#24365a" stroke-width="1.2"/><path d="M58 58H96V64H132V68H170V75H214V79H262V86H330" fill="none" stroke="#2ce8ff" stroke-width="2" stroke-linejoin="round"/><path d="M58 58H82V70H110V82H142V94H180V103H226V110H330" fill="none" stroke="#ff5cb8" stroke-width="2" stroke-linejoin="round"/><line x1="150" y1="63" x2="150" y2="73" stroke="#2ce8ff" stroke-width="1.4"/><line x1="238" y1="74" x2="238" y2="84" stroke="#2ce8ff" stroke-width="1.4"/><line x1="296" y1="81" x2="296" y2="91" stroke="#2ce8ff" stroke-width="1.4"/><line x1="124" y1="77" x2="124" y2="87" stroke="#ff5cb8" stroke-width="1.4"/><line x1="204" y1="98" x2="204" y2="108" stroke="#ff5cb8" stroke-width="1.4"/><text x="194" y="141" font-size="10.5" class="mono low caps" text-anchor="middle">TIME</text><circle cx="352" cy="66" r="4" fill="#2ce8ff"/><text x="362" y="70" font-size="11.5" class="mono mid">high</text><circle cx="352" cy="88" r="4" fill="#ff5cb8"/><text x="362" y="92" font-size="11.5" class="mono mid">low</text>
  <text x="26" y="162" font-size="11.5" class="mono low caps">EXPRESSION AND OUTCOME</text>
  <rect x="372" y="157" width="34" height="2" rx="1" fill="#2ce8ff" class="pulse"/>
</svg>
