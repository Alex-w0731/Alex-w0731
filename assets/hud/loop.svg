<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="Research loop: observe tumor and clinical data, model single-cell and spatial patterns, perturb with functional genomics, validate mechanisms and targets, then return with new questions.">
  <title>Research loop: observe tumor and clinical data, model single-cell and spatial patterns, perturb with functional genomics, validate mechanisms and targets, then return with new questions.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ce8ff"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff5cb8"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ce8ff" stop-opacity=".9"/><stop offset="1" stop-color="#2ce8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ce8ff" stop-opacity=".35"/><stop offset="1" stop-color="#2ce8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloM" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5cb8" stop-opacity=".32"/><stop offset="1" stop-color="#ff5cb8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#18233a" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#24365a" opacity=".7"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .hi { fill: #eaf2ff; } .mid { fill: #a3b3cc; } .low { fill: #7889a6; }
    .cy { fill: #2ce8ff; } .cy2 { fill: #9ff4ff; } .mg { fill: #ff5cb8; }
    .vi { fill: #a78bfa; } .am { fill: #fbbf24; } .gr { fill: #34d399; } .bl { fill: #60a5fa; }
    .caps { letter-spacing: 0.16em; }
    .tight { letter-spacing: 0.04em; }
    .b { font-weight: 700; } .sb { font-weight: 600; }
    .s-cy { stroke: #2ce8ff; } .s-mg { stroke: #ff5cb8; } .s-vi { stroke: #a78bfa; }
    .s-line { stroke: #18233a; } .s-line2 { stroke: #24365a; } .s-low { stroke: #7889a6; }
    .nf { fill: none; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -64; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinr { to { transform: rotate(-360deg); } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .breathe { animation: breathe 4.8s ease-in-out infinite; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    .flow { stroke-dasharray: 6 10; animation: dash 2.4s linear infinite; }
    .flow-slow { stroke-dasharray: 2 14; animation: dash 5s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    .spinr { transform-box: fill-box; transform-origin: center; animation: spinr 36s linear infinite; }
    .floaty { animation: floaty 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="879" height="235" rx="14" fill="url(#bg)" stroke="#24365a"/>
  <rect x="1" y="1" width="878" height="234" rx="14" fill="url(#grid)"/>
