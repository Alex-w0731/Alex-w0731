  <line x1="376" y1="96" x2="504" y2="96" stroke="#24365a" stroke-width="1"/><line x1="376" y1="96" x2="504" y2="96" stroke="#60a5fa" stroke-width="1.8" class="flow" stroke-linecap="round"/><path d="M497 91l7 5l-7 5" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="584" y1="96" x2="712" y2="96" stroke="#24365a" stroke-width="1"/><line x1="584" y1="96" x2="712" y2="96" stroke="#ff5cb8" stroke-width="1.8" class="flow" stroke-linecap="round"/><path d="M705 91l7 5l-7 5" fill="none" stroke="#ff5cb8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M752 188V194a10 10 0 0 1 -10 10H138a10 10 0 0 1 -10 -10V188" fill="none" stroke="#24365a" stroke-width="1"/><path d="M752 188V194a10 10 0 0 1 -10 10H138a10 10 0 0 1 -10 -10V188" fill="none" stroke="#a78bfa" stroke-width="1.4" class="flow-slow" stroke-linecap="round" opacity=".9"/><path d="M123 195l5 -7l5 7" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="378.6" y="194" width="122.8" height="20" rx="10" fill="#0b1222" stroke="#24365a"/><text x="440" y="208" font-size="11" class="mono vi caps" text-anchor="middle">NEW QUESTIONS</text>
  <circle cx="128" cy="96" r="57" fill="url(#halo)" class="breathe" style="animation-delay:0s"/><circle cx="128" cy="96" r="30" fill="#0b1222" stroke="#2ce8ff" stroke-width="1.5"/><circle cx="128" cy="96" r="37" fill="none" stroke="#2ce8ff" stroke-opacity=".3" stroke-dasharray="3 7" class="spin"/><g fill="none" stroke="#2ce8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="96" r="11"/><path d="M128 79v6M128 107v6M111 96h6M139 96h6"/></g><circle cx="128" cy="96" r="2.6" fill="#2ce8ff"/>
  <text x="128" y="156" font-size="15" class="mono b caps" text-anchor="middle" fill="#2ce8ff">OBSERVE</text><text x="128" y="176" font-size="13" class="sans mid" text-anchor="middle">tumor &amp; clinical data</text>
  <text x="94" y="68" font-size="11" class="mono low" text-anchor="end">01</text>
  <circle cx="336" cy="96" r="57" fill="url(#halo)" class="breathe" style="animation-delay:0.8s"/><circle cx="336" cy="96" r="30" fill="#0b1222" stroke="#60a5fa" stroke-width="1.5"/><circle cx="336" cy="96" r="37" fill="none" stroke="#60a5fa" stroke-opacity=".3" stroke-dasharray="3 7" class="spin"/><path d="M324 103L335 99M332 86L335 99M345 92L335 99M347 106L335 99M332 86L345 92" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7"/><circle cx="324" cy="103" r="2.8" fill="#60a5fa"/><circle cx="332" cy="86" r="2.8" fill="#60a5fa"/><circle cx="345" cy="92" r="2.8" fill="#60a5fa"/><circle cx="347" cy="106" r="2.8" fill="#60a5fa"/><circle cx="335" cy="99" r="2.8" fill="#60a5fa"/>
  <text x="336" y="156" font-size="15" class="mono b caps" text-anchor="middle" fill="#60a5fa">MODEL</text><text x="336" y="176" font-size="13" class="sans mid" text-anchor="middle">single-cell &amp; spatial patterns</text>
  <text x="302" y="68" font-size="11" class="mono low" text-anchor="end">02</text>
  <circle cx="544" cy="96" r="57" fill="url(#haloM)" class="breathe" style="animation-delay:1.6s"/><circle cx="544" cy="96" r="30" fill="#0b1222" stroke="#ff5cb8" stroke-width="1.5"/><circle cx="544" cy="96" r="37" fill="none" stroke="#ff5cb8" stroke-opacity=".3" stroke-dasharray="3 7" class="spin"/><g fill="none" stroke="#ff5cb8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M528 91H540M548 91H560"/><path d="M528 101H540M548 101H560"/><path d="M533 91v10M555 91v10" stroke-opacity=".55"/></g><path d="M546 81l-5 12h6l-5 12" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="544" y="156" font-size="15" class="mono b caps" text-anchor="middle" fill="#ff5cb8">PERTURB</text><text x="544" y="176" font-size="13" class="sans mid" text-anchor="middle">functional genomics</text>
  <text x="510" y="68" font-size="11" class="mono low" text-anchor="end">03</text>
  <circle cx="752" cy="96" r="57" fill="url(#halo)" class="breathe" style="animation-delay:2.4s"/><circle cx="752" cy="96" r="30" fill="#0b1222" stroke="#34d399" stroke-width="1.5"/><circle cx="752" cy="96" r="37" fill="none" stroke="#34d399" stroke-opacity=".3" stroke-dasharray="3 7" class="spin"/><g fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M752 81l13 7.5v15l-13 7.5l-13-7.5v-15z"/><path d="M746 96l4.5 4.5l8-9" stroke-width="2"/></g>
  <text x="752" y="156" font-size="15" class="mono b caps" text-anchor="middle" fill="#34d399">VALIDATE</text><text x="752" y="176" font-size="13" class="sans mid" text-anchor="middle">mechanisms &amp; targets</text>
  <text x="718" y="68" font-size="11" class="mono low" text-anchor="end">04</text>
</svg>
