<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 244" width="880" height="244" role="img" aria-label="tmelens: profile the tumour immune microenvironment from bulk transcriptomes">
  <title>tmelens: profile the tumour immune microenvironment from bulk transcriptomes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ce8ff"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff5cb8"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ce8ff" stop-opacity=".9"/><stop offset="1" stop-color="#2ce8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ce8ff" stop-opacity=".35"/><stop offset="1" stop-color="#2ce8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloM" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5cb8" stop-opacity=".32"/><stop offset="1" stop-color="#ff5cb8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#18233a" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#24365a" opacity=".7"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
