    <linearGradient id="radar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111D31"/>
      <stop offset="1" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="radar-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63E4F2" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#BBA2FF" stop-opacity="0.40"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="1098.5" height="198.5" rx="18" fill="url(#radar-bg)" stroke="#26374F" stroke-width="1.5"/>
