<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200" role="img" aria-labelledby="radar-title radar-desc">
  <title id="radar-title">Research Radar — Questions to methods</title>
  <desc id="radar-desc">A curated collection of 97 resources connecting research questions with spatial analysis, cell states, perturbation, delivery, and morphology. Decorative theme map, not experimental data.</desc>
