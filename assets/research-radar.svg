  <text x="42" y="82" fill="#EAF3FF" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" letter-spacing="1">RESEARCH RADAR</text>
  <text x="42" y="123" fill="#BBA2FF" font-family="Arial,Helvetica,sans-serif" font-size="28">Questions → methods</text>
  <rect x="42" y="146" width="154" height="31" rx="15.5" fill="#142D3D" stroke="#63E4F2" stroke-opacity="0.3"/>
  <text x="119" y="168" text-anchor="middle" fill="#63E4F2" font-family="Arial,Helvetica,sans-serif" font-size="19">97 resources</text>
