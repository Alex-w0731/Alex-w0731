<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1100, height=420" />
<script src="gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1100px;height:420px;overflow:hidden;background:#0D1424}
body{font-family:"Avenir Next",sans-serif;color:#EAF3FF}
#root{position:relative;width:1100px;height:420px;overflow:hidden;border:1px solid #243850;border-radius:20px;background:#0D1424}
.scene-content{display:flex;flex-direction:column;gap:0;width:100%;height:100%;padding:34px 44px;position:relative;z-index:4;pointer-events:none}
.identity{font-family:Menlo,monospace;font-size:17px;letter-spacing:2px;font-weight:400;color:#EAF3FF;display:flex;gap:15px;align-items:center}
.status{width:7px;height:7px;border-radius:100%;background:#63E4F2;box-shadow:0 0 12px #63E4F266}
.identity .lab{color:#9DACC6;font-size:15px;letter-spacing:1px}
h1{font-size:72px;line-height:1.05;letter-spacing:-2.3px;font-weight:800;width:640px;margin-top:24px}
h1 span{color:#BBA2FF;display:block}
.subtitle{font-size:20px;font-weight:400;line-height:1.5;color:#9DACC6;margin-top:17px;width:590px}
.discipline{font:16px Menlo,monospace;letter-spacing:1.3px;color:#63E4F2;margin-top:auto}
.formula{font:13px Menlo,monospace;letter-spacing:1px;color:#9DACC6;margin-top:11px}
.decor{position:absolute;inset:0;pointer-events:none}
#mascot{position:absolute;right:32px;top:17px;width:365px;height:365px;z-index:3;transform-origin:50% 60%;object-fit:contain}
.ring{position:absolute;width:303px;height:303px;right:63px;top:55px;border:1px solid #243850;border-radius:100%}
.ring:after{content:"";position:absolute;inset:25px;border-radius:100%;border:1px dashed #243850}
.tag{position:absolute;right:77px;bottom:26px;z-index:5;font:12px Menlo,monospace;letter-spacing:1.2px;color:#BBA2FF;background:#0D1424;padding:8px 13px;border:1px solid #574D7B;border-radius:6px}
.dot-grid{position:absolute;right:31px;top:26px;width:60px;height:40px;background-image:radial-gradient(#3C5377 1px,transparent 1px);background-size:12px 12px;opacity:.65}
.bubble{position:absolute;border:1.6px solid #63E4F2;border-radius:100%;z-index:5}
#b1{right:318px;top:126px;width:7px;height:7px}
#b2{right:329px;top:105px;width:10px;height:10px}
#b3{right:307px;top:94px;width:5px;height:5px}
#spark{position:absolute;right:46px;top:223px;z-index:5;width:34px;height:47px;filter:drop-shadow(0 0 5px #63E4F255)}
.molecule{position:absolute;right:15px;top:109px;width:110px;height:60px;z-index:1}
#electron-system{transform-origin:842px 207px}
#glow{position:absolute;right:65px;top:63px;width:275px;height:275px;border-radius:100%;background:radial-gradient(circle,#27456A55,transparent 68%)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1100" data-height="420">
  <div class="decor" data-layout-ignore aria-hidden="true">
    <div id="glow"></div><div class="ring"></div><div class="dot-grid"></div>
    <svg width="1100" height="420" viewBox="0 0 1100 420">
      <path d="M690 75h-29v31M1028 303v33h-32M655 313h30" stroke="#3F5E82" fill="none"/>
      <g id="electron-system" fill="none" stroke="#476581" stroke-width="1">
        <ellipse cx="842" cy="207" rx="178" ry="84" transform="rotate(-33 842 207)"/>
        <ellipse cx="842" cy="207" rx="178" ry="84" transform="rotate(33 842 207)" opacity=".65"/>
        <circle cx="693" cy="288" r="4" fill="#63E4F2" stroke="none"/>
        <circle cx="989" cy="126" r="4" fill="#BBA2FF" stroke="none"/>
      </g>
      <path d="M652 148l-15 8 15 9 15-9zM652 165v21l-17 11 17 10 18-10-18-11M635 156v22M669 156v22" fill="none" stroke="#53638A" stroke-width="1.4"/>
      <path d="M47 394H608" stroke="#243850"/>
      <circle id="trace-dot" cx="47" cy="394" r="2.5" fill="#63E4F2"/>
      <path d="M1032 65v9M1028 69h8M695 332v10M690 337h10" stroke="#879DBE"/>
    </svg>
    <svg class="molecule" viewBox="0 0 110 60"><path d="M14 30L41 13l29 17-2 23M70 30l29-17" stroke="#536B93" fill="none"/><g fill="#0D1424" stroke="#BBA2FF"><circle cx="14" cy="30" r="4"/><circle cx="41" cy="13" r="5"/><circle cx="70" cy="30" r="4"/><circle cx="68" cy="53" r="4"/><circle cx="99" cy="13" r="4"/></g></svg>
  </div>
  <div class="scene-content">
    <div class="identity"><i class="status" aria-hidden="true"></i><strong>ALEX WANG</strong><span class="lab">/ THE CURIOSITY LAB</span></div>
    <h1>Curiosity,<span>with a spark.</span></h1>
    <p class="subtitle">Serious about science. Playful at heart.</p>
    <p class="discipline">CANCER BIOLOGY × CODE</p>
    <p class="formula">OBSERVE → MODEL → TEST → REPEAT</p>
  </div>
  <img id="mascot" src="killua-scientist.png" alt="Original chibi Killua scientist carrying a glowing flask and electricity" data-layout-ignore />
  <div id="b1" class="bubble" data-layout-ignore></div><div id="b2" class="bubble" data-layout-ignore></div><div id="b3" class="bubble" data-layout-ignore></div>
  <svg id="spark" viewBox="0 0 34 47" data-layout-ignore><path d="M22 2L4 26h13l-5 19 19-27H18z" fill="#63E4F2"/></svg>
  <span class="tag">KILLUA / LAB PARTNER ⚡</span>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.to('#mascot',{y:-7,rotation:1.4,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:3},0);
tl.to('#electron-system',{rotation:360,duration:6,ease:'none',transformOrigin:'842px 207px'},0);
tl.to('#glow',{scale:1.14,opacity:.7,duration:3,ease:'sine.inOut',yoyo:true,repeat:1},0);
tl.to('.molecule',{y:-5,rotation:4,duration:3,ease:'sine.inOut',yoyo:true,repeat:1},0);
tl.to('#spark',{scale:.82,opacity:.5,duration:.75,ease:'sine.inOut',yoyo:true,repeat:7,transformOrigin:'50% 50%'},0);
tl.to('#b1',{y:-11,opacity:.25,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:3},0);
tl.to('#b2',{y:-8,opacity:.3,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:3},0);
tl.to('#b3',{y:-14,opacity:.2,duration:3,ease:'sine.inOut',yoyo:true,repeat:1},0);
tl.to('#trace-dot',{x:561,duration:3,ease:'power1.inOut',yoyo:true,repeat:1},0);
tl.to('.status',{opacity:.45,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:3},0);
window.__timelines.main=tl;
</script>
</body>
</html>
